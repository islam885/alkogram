name: Build Alkogram APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools and NDK
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.0" "build-tools;30.0.3" "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          # Workaround for AGP dx tool copy if required
          if [ -f "$ANDROID_HOME/build-tools/30.0.3/dx" ]; then
            cp "$ANDROID_HOME/build-tools/30.0.3/dx" "$ANDROID_HOME/build-tools/33.0.0/dx" || true
            cp "$ANDROID_HOME/build-tools/30.0.3/lib/dx.jar" "$ANDROID_HOME/build-tools/33.0.0/lib/dx.jar" || true
          fi

      - name: Prepare API_KEYS and keystore
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'alkogram_pass' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'alkogram' }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD || 'alkogram_pass' }}
          APP_ID: ${{ secrets.APP_ID || '6' }}
          APP_HASH: ${{ secrets.APP_HASH || 'eb06d4abfb49dc3eeb1aeb98ae0f581e' }}
          MAPS_V2_API: ${{ secrets.MAPS_V2_API || '' }}
        run: |
          cat <<EOF > API_KEYS
          APP_ID = ${APP_ID}
          APP_HASH = "${APP_HASH}"
          MAPS_V2_API = "${MAPS_V2_API}"
          SIGNING_KEY_PASSWORD = ${SIGNING_KEY_PASSWORD}
          SIGNING_KEY_ALIAS = ${SIGNING_KEY_ALIAS}
          SIGNING_KEY_STORE_PASSWORD = ${SIGNING_KEY_STORE_PASSWORD}
          EOF

          # If release keystore does not exist or needs fallback generation, generate one
          if [ ! -f "TMessagesProj/config/extera.jks" ]; then
            mkdir -p TMessagesProj/config
            keytool -genkeypair -v \
              -keystore TMessagesProj/config/extera.jks \
              -alias "${SIGNING_KEY_ALIAS}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${SIGNING_KEY_STORE_PASSWORD}" \
              -keypass "${SIGNING_KEY_PASSWORD}" \
              -dname "CN=Alkogram, OU=Dev, O=Alkogram, L=City, S=State, C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Arm64 Release APK
        run: ./gradlew assembleArm64Release --stacktrace

      - name: Find and Collect APK
        id: collect_apk
        run: |
          mkdir -p output_apks
          find TMessagesProj/build/outputs/apk/ -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alkogram-Release-APK
          path: output_apks/*.apk
          retention-days: 14

